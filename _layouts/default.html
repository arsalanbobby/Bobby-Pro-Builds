<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "GeneralContractor",
    "name": "Bobby Pro Builds",
    "url": "https://www.bobbyprobuilds.com/",
    "description": "Builders and renovation specialists serving London, Surrey and customers across England.",
    "telephone": "+44 7344 304402",
    "email": "Quickfixhome2@gmail.com",
    "areaServed": ["London", "Surrey", "England"],
    "knowsAbout": ["House extensions", "Loft conversions", "Conservatories", "Kitchen renovations", "Bathroom renovations", "Property improvements"]
  }
  </script>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/home-split.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}#home" aria-label="Bobby Pro Builds home">
        <img src="{{ '/assets/logo.svg' | relative_url }}" alt="Bobby Pro Builds logo">
        <span>Bobby Pro Builds</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#home">Home</a>
        <a href="{{ '/' | relative_url }}#services">Services</a>
        <a href="{{ '/' | relative_url }}#about">About</a>
        <a href="{{ '/' | relative_url }}#gallery">Gallery</a>
        <a href="{{ '/' | relative_url }}#contact">Contact</a>
      </nav>
      <a class="header-quote" href="{{ '/' | relative_url }}#contact">Get a Quote</a>
      <button class="quick-menu-toggle" type="button" aria-expanded="false" aria-controls="quick-menu" aria-label="Open menu"><span></span><span></span></button>
    </div>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer">
    <div class="footer-slogan">Building Better Homes &amp; Creating Better Gardens</div>
    <div class="footer-lower">
      <div class="container footer-inner">
        <span>&copy; {{ 'now' | date: "%Y" }} Bobby Pro Builds. All rights reserved.</span>
        <div class="social-icons" aria-label="Social media">
          <span class="social-icon facebook" aria-label="Facebook" title="Facebook">f</span><span class="social-icon instagram" aria-label="Instagram" title="Instagram">◎</span><span class="social-icon tiktok" aria-label="TikTok" title="TikTok">♪</span>
        </div>
      </div>
    </div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
