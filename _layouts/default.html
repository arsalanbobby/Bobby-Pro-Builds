<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/home-split.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}#home" aria-label="Bobby Pro Builds home">
        <img src="{{ '/assets/logo.svg' | relative_url }}" alt="Bobby Pro Builds logo">
        <span>Bobby Pro Builds</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#home">Home</a>
        <a href="{{ '/' | relative_url }}#about">About</a>
        <a href="{{ '/' | relative_url }}#services">Services</a>
        <button type="button" class="nav-panel-link js-gallery-open">Gallery</button>
        <button type="button" class="nav-panel-link js-contact-open">Contact</button>
      </nav>
      <button type="button" class="header-quote js-contact-open">Get a Quote</button>
      <button class="quick-menu-toggle" type="button" aria-expanded="false" aria-controls="quick-menu" aria-label="Open menu"><span></span><span></span></button>
    </div>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer"><div class="container footer-inner"><div><strong>Bobby Pro Builds</strong><span>Building • Renovation • Property Improvements</span></div><span>&copy; {{ 'now' | date: "%Y" }} Bobby Pro Builds. All rights reserved.</span></div></footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
